# Mosquitto прода «Бильярдума» (deploy/prod/compose.yml, протокол §2, decisions №15).
# Только TLS на 8883, анонимный вход запрещён, доступ — плагин Dynamic Security: клиентов и
# роли устройств сервер создаёт на ходу при привязке, без правки файлов и перезапуска.
#
# НЕ ПЕРЕЗАПУСКАТЬ В ЧАСЫ РАБОТЫ КЛУБОВ (CLAUDE.md). Правка этого файла и новый сертификат
# применяются по SIGHUP: deploy/prod/bin/mqtt-reload.sh (сертификаты копирует он же).
# Перезапуск контейнера — только в окне обслуживания (docs/deploy/RUNBOOK.md §5).
#
# Сертификаты — от CA платформы (deploy/prod/bin/mqtt-certs.sh): ECDSA P-256, CA закреплён в
# прошивке (протокол §2). В /mosquitto/certs их копирует команда запуска сервиса.

allow_anonymous false
per_listener_settings false

# Предел размера MQTT-пакета целиком, байт: cmd ≤ 2048, state и event ≤ 4096 (протокол §2).
max_packet_size 8192

# Контроллеры с keepalive 30 с; клиент без пакетов дольше 1,5 keepalive отключается брокером.
max_keepalive 120
# clean session у всех (протокол §2): брокер не копит команды офлайн-устройствам.
max_queued_messages 100
max_inflight_messages 20

listener 8883
protocol mqtt
# Защита от наплыва соединений: на пилоте десятки контроллеров, сервер и служебные клиенты.
max_connections 2000
certfile /mosquitto/certs/mqtt.crt
keyfile /mosquitto/certs/mqtt.key
tls_version tlsv1.2

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Логи — в stdout контейнера (ротация json-file). В них логины устройств (device_id) и адреса
# клубов, персональных данных гостей нет.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

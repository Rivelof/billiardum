# Mosquitto для разработки «Бильярдума» (deploy/dev, контракт M0 §2).
# Только TLS на 8883, анонимный вход запрещён, доступ — плагин Dynamic Security
# (decisions №15). Порт 1883 не слушаем.
#
# Сертификаты копирует в /mosquitto/certs команда запуска сервиса (compose.yml)
# из deploy/dev/certs/, которые создаёт scripts/dev-certs.mjs.

allow_anonymous false

listener 8883
protocol mqtt
certfile /mosquitto/certs/mqtt.crt
keyfile /mosquitto/certs/mqtt.key
tls_version tlsv1.2

# Клиенты, роли и ACL хранятся в томе данных и меняются на ходу
# (mosquitto_ctrl или топик $CONTROL/dynamic-security/v1), без перезапуска брокера.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

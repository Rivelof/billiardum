; Прошивка контроллера стола «Бильярдума» — docs/protocol.md v1.
;
;   pio run -e esp32dev            сборка для ESP32 (Arduino-ESP32 2.0.17, ESP-IDF 4.4)
;   pio run -e esp32dev -t upload  прошивка по USB (только стенд; в клубе — OTA по «да» Андрея)
;   pio test -e native             тесты логики на компьютере (doctest)
;
; Логика (lib/logic) — чистый C++17 без Arduino; драйверы (lib/drivers) и платформа
; (lib/platform) — только для esp32dev. Подробности — README.md.

[platformio]
default_envs = esp32dev

[common]
build_flags =
  -std=gnu++17
  -Wall
  -Wextra

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags}
  -D BL_FW_VERSION=\"1.0.0\"
  -D CORE_DEBUG_LEVEL=2
  ; Плата: путь A (своя плата) по умолчанию. Для готового реле (путь B) — переопределить пины,
  ; отсутствующий узел — -1 (тогда его нет в caps). Пины — README, «Железо».
  -D BL_PIN_RELAY=26
  -D BL_RELAY_ACTIVE_HIGH=1
  -D BL_PIN_LED=27
  -D BL_PIN_BUZZER=25
  -D BL_PIN_CURRENT=34
  -D BL_PIN_DIMMER=-1
  ; Датчик тока: мА на 1 мВ среднеквадратичного напряжения на нагрузочном резисторе
  ; (SCT-013-030: 30 А / 1 В → 30 мА/мВ). Калибруется на стенде.
  -D BL_CT_MA_PER_MV=30
  ; Адрес API для привязки (§7). Для стенда разработки — свой адрес и свой CA.
  -D BL_API_URL=\"https://billiardum.ru\"
lib_ldf_mode = deep+
test_ignore = *

[env:native]
platform = native
test_framework = doctest
test_filter = native/*
test_build_src = no
lib_ignore = bl-drivers, bl-platform
build_flags =
  ${common.build_flags}
  -D BL_REPO_ROOT=\"$PROJECT_DIR/..\"
